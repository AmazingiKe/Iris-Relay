[project]
name = "iris-relay"
version = "0.4.0"
description = "面向 DCC 插件的统一材质转换核心"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "materialx==1.39.5",
    "pypinyin==0.55.0",
]

[project.optional-dependencies]
http = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]
dev = ["pytest>=8,<10", "coverage[toml]>=7,<8", "ruff>=0.12,<1", "httpx>=0.28,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["_tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["iris_relay"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# 宿主侧薄接口保持 Maya 2022 自带 Python 3.7 可解析。
[tool.ruff.per-file-target-version]
"plugins/maya/*.py" = "py37"
"plugins/core.py" = "py37"
"plugins/presentation.py" = "py37"
"plugins/resources.py" = "py37"
"_examples/maya_demo_gui.py" = "py37"
"iris_relay/{__init__,protocol,transport,native,model}.py" = "py37"
"iris_relay/http_client.py" = "py37"
"_scripts/verify_maya_import.py" = "py37"
"_scripts/verify_http_host.py" = "py37"
"_scripts/probe_maya.py" = "py37"
"_scripts/probe_maya_render.py" = "py37"
"_scripts/probe_maya_texture.py" = "py37"
"_scripts/probe_maya_materialx_native.py" = "py37"
"_scripts/neural_experiment.py" = "py37"
"_scripts/render_maya_experiment.py" = "py37"
"_scripts/render_maya_predictions.py" = "py37"
"_scripts/verify_maya_editor_ui.py" = "py37"
"_scripts/verify_maya_panel_ui.py" = "py37"
"_scripts/verify_maya_native.py" = "py37"
"_scripts/verify_host_transactions.py" = "py37"
"_scripts/verify_node_names.py" = "py37"
