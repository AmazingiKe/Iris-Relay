[project]
name = "iris-relay"
version = "0.4.0"
description = "面向 DCC 插件的统一材质转换核心"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "materialx==1.39.5",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "coverage[toml]>=7,<8", "ruff>=0.12,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["_tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["iris_relay"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
